name: QMP conformance

on:
  push:
  pull_request:

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Start reference shop
        run: |
          node qmp/reference-shop.mjs qmp/fixtures/velo.csv 4010 > "$RUNNER_TEMP/qmp-shop.log" 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:4010/.well-known/qomvia.json; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://localhost:4010/.well-known/qomvia.json > /dev/null
      - name: Run conformance checks
        run: node qmp/conformance.mjs http://localhost:4010 shop-secret
